<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Pantalla de Login -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h1>Nuestra Historia</h1>
            <p class="subtitle">Comparte momentos especiales juntos</p>

            <form id="login-form" onsubmit="login(event)">
                <div class="form-group">
                    <label for="usuario">¿Quién eres?</label>
                    <div class="user-buttons">
                        <button type="button" class="user-btn" data-user="yo" onclick="selectUser(this)">
                            <span class="emoji">👨</span> Yo
                        </button>
                        <button type="button" class="user-btn" data-user="mi_novia" onclick="selectUser(this)">
                            <span class="emoji">👩</span> Mi Novia
                        </button>
                    </div>
                    <input type="hidden" id="usuario" name="usuario" required>
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" required>
                    <small>Yo: 1234 | Mi Novia: 5678</small>
                </div>

                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <!-- Pantalla Principal -->
    <div id="main-screen" class="screen">
        <header class="header">
            <h1>Nuestra Historia</h1>
            <div class="header-actions">
                <span id="user-badge" class="user-badge"></span>
                <button class="btn btn-secondary" onclick="logout()">Salir</button>
            </div>
        </header>

        <main class="container">
            <!-- Sección de Subida -->
            <section class="upload-section" id="upload-section">
                <h2>Agregar un Momento</h2>
                <form id="upload-form" onsubmit="subirFoto(event)">
                    <div class="form-group">
                        <label for="foto">Selecciona una Foto</label>
                        <input type="file" id="foto" name="foto" accept="image/*" required>
                        <div class="preview-container" id="preview-container"></div>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Describe este Momento (Opcional)</label>
                        <textarea id="descripcion" name="descripcion" placeholder="Escribe algo especial..." rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submit-btn">Subir Foto</button>
                </form>
                <div id="upload-error" class="error-message"></div>
                <div id="upload-success" class="success-message"></div>
            </section>

            <!-- Nuestra Historia -->
            <section class="history-section">
                <h2>Nuestra Historia</h2>
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('todo', event)">Toda la Historia</button>
                    <button class="tab-btn" onclick="showTab('mia', event)">Mi Aporte</button>
                </div>

                <div id="todo-tab" class="tab-content active">
                    <div id="historia-container" class="historia-grid"></div>
                </div>

                <div id="mia-tab" class="tab-content">
                    <div id="mi-historia-container" class="historia-grid"></div>
                </div>

                <div id="empty-state" class="empty-state">
                    <p>📸 Sin fotos aún. ¡Sé el primero en compartir un momento!</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal de Foto Completa -->
    <div id="photo-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <img id="modal-img" src="" alt="">
            <div class="modal-info">
                <h3 id="modal-usuario"></h3>
                <p id="modal-fecha"></p>
                <p id="modal-descripcion" class="modal-descripcion"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
